name: iOS CI
run-name: ${{ inputs.review_pr && format('iOS CI review PR {0}', inputs.review_pr) || github.ref_name }}

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      full_check:
        description: Run full compilation, module and behavior validation
        required: false
        default: false
        type: boolean
      review_pr:
        description: Reviewed fork PR number; select the internal branch containing its exact GitHub merge commit
        required: false
        default: 0
        type: number
      release_check:
        description: Run release acceptance against the public version and bound device evidence
        required: false
        default: false
        type: boolean
      validation_tag:
        description: Version tag containing the bound release-receipt.json asset
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-ci-${{ github.ref }}-${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.release_check }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.release_check) }}

jobs:
  validation-plan:
    name: Select affected validation groups
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check)
    runs-on: xcode-27
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Select affected validation groups
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_FULL_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.full_check }}
          BIT101_RELEASE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.release_check }}
        run: python3 Scripts/ci_evidence.py plan

  static-audit:
    needs: [validation-plan]
    if: ${{ !cancelled() && (needs.validation-plan.result == 'success' || needs.validation-plan.result == 'skipped') }}
    name: Static audit (Apple toolchain)
    runs-on: xcode-27
    timeout-minutes: 105
    env:
      BIT101_CI_PLAN: ${{ needs.validation-plan.outputs.plan }}
      BIT101_CI_GROUP: modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Verify maintainer review commit
        id: review
        if: github.event_name == 'workflow_dispatch' && inputs.review_pr > 0
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          base_sha="$(python3 Scripts/ci_evidence.py review-pr "$BIT101_REVIEW_PR")"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
      - name: Show toolchain
        run: Scripts/build-install-device.sh toolchain
      - name: Reuse compatible successful validation
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check)) && !fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: python3 Scripts/ci_evidence.py reuse "$BIT101_CI_GROUP"
      - name: Install Worker test dependencies
        working-directory: Cloudflare/EmergencyUpdateWorker
        run: npm ci
      - name: Install Python analysis tool
        run: brew install --quiet ruff
      - name: Load target branch coverage baseline
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check)
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_BASE_COMMIT: ${{ github.event.pull_request.base.sha || steps.review.outputs.base_sha }}
        run: |
          python3 Scripts/ci_evidence.py baseline "$BIT101_BASE_COMMIT"
          python3 Scripts/validation_evidence.py baseline "$BIT101_BASE_COMMIT"
      - name: Run static audit and Swift modules
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check)) && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        env:
          BIT101_VERSION_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || steps.review.outputs.base_sha || '' }}
          BIT101_RELEASE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.release_check }}
        run: Scripts/run-extended-tests.sh verify audit modules
      - name: Run static audit
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check)) || !fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        env:
          BIT101_VERSION_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || steps.review.outputs.base_sha || '' }}
          BIT101_RELEASE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.release_check }}
        run: Scripts/run-static-audit.sh

      - name: Publish validation evidence
        if: ${{ !cancelled() }}
        run: python3 Scripts/validation_evidence.py summary --recorded-environment

      - name: Export validated result
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check)) && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: python3 Scripts/ci_evidence.py export-result modules
      - name: Publish validated result
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check)) && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-result-modules
          path: .build/extended-automation/ci-validation-result.json
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          include-hidden-files: true

      - name: Select validation diagnostics
        id: diagnostics
        if: ${{ always() }}
        env:
          BIT101_CI_CANCELLED: ${{ job.status == 'cancelled' }}
          BIT101_DIAGNOSTIC_PATHS: |
            .build/static-audit/*.log
            .build/compiler-cache/swift-syntax-indexer
            .build/compiler-cache/swift-syntax-indexer-inputs.json
            .build/static-audit/compilation-conditions.json
            .build/code-quality-report.txt
            .build/ui-consistency-report.txt
            .build/explanatory-text-report.txt
            .build/extended-automation/modules.log
            .build/extended-automation/module-events.jsonl
            .build/extended-automation/test-metrics.txt
        run: python3 Scripts/ci_diagnostics.py
      - name: Preserve validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: ${{ steps.diagnostics.outputs.paths }}
  release-build:
    needs: [validation-plan]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check)
    name: Release app and extension builds
    runs-on: xcode-27
    timeout-minutes: 285
    env:
      BIT101_CI_PLAN: ${{ needs.validation-plan.outputs.plan }}
      BIT101_CI_GROUP: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Show toolchain
        run: Scripts/build-install-device.sh toolchain
      - name: Reuse compatible successful validation
        if: ${{ !fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: python3 Scripts/ci_evidence.py reuse "$BIT101_CI_GROUP"
      - name: Restore native compilation cache
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci_evidence.py cache-restore "release-build"
      - name: Archive app and extensions with release compiler settings
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: Scripts/build-install-device.sh archive
      - name: Build network smoke host and tests
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: Scripts/run-extended-tests.sh build network-smoke
      - name: Build iCloud smoke host and tests
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: Scripts/run-extended-tests.sh build icloud-smoke

      - name: Publish validation evidence
        if: ${{ !cancelled() && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: python3 Scripts/validation_evidence.py summary --recorded-environment

      - name: Export validated result
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: python3 Scripts/ci_evidence.py export-result release
      - name: Publish validated result
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-result-release
          path: .build/extended-automation/ci-validation-result.json
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          include-hidden-files: true

      - name: Prepare native compilation cache
        id: native-cache
        continue-on-error: true
        if: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: python3 Scripts/ci_evidence.py cache-export "release-build"
      - name: Preserve native compilation cache
        continue-on-error: true
        if: ${{ steps.native-cache.outcome == 'success' && (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compilation-cache-release-build
          compression-level: 0
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build/compiler-cache/CompilationCache.noindex
            .build/compiler-cache/compilation-cache.json
            .build/compiler-cache/swift-syntax-indexer
            .build/compiler-cache/swift-syntax-indexer-inputs.json
      - name: Select validation diagnostics
        id: diagnostics
        if: ${{ always() && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        env:
          BIT101_CI_CANCELLED: ${{ job.status == 'cancelled' }}
          BIT101_DIAGNOSTIC_PATHS: |
            .build/extended-automation/build-network-smoke.log
            .build/extended-automation/build-icloud-smoke.log
            .build/extended-automation/diagnostics/test-results.xcresult
            build/DeviceInstall/build.log
        run: python3 Scripts/ci_diagnostics.py
      - name: Preserve validation diagnostics
        if: ${{ always() && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: ${{ steps.diagnostics.outputs.paths }}
  catalyst-tests:
    needs: [validation-plan]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check)
    name: Mac Catalyst behavior tests
    runs-on: xcode-27
    timeout-minutes: 105
    env:
      BIT101_CI_PLAN: ${{ needs.validation-plan.outputs.plan }}
      BIT101_CI_GROUP: catalyst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Verify maintainer review commit
        id: review
        if: github.event_name == 'workflow_dispatch' && inputs.review_pr > 0
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          base_sha="$(python3 Scripts/ci_evidence.py review-pr "$BIT101_REVIEW_PR")"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
      - name: Show toolchain
        run: Scripts/build-install-device.sh toolchain
      - name: Reuse compatible successful validation
        if: ${{ !fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: python3 Scripts/ci_evidence.py reuse "$BIT101_CI_GROUP"
      - name: Restore native compilation cache
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci_evidence.py cache-restore "catalyst-tests"
      - name: Load target branch coverage baseline
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_BASE_COMMIT: ${{ github.event.pull_request.base.sha || steps.review.outputs.base_sha }}
        run: |
          python3 Scripts/ci_evidence.py baseline "$BIT101_BASE_COMMIT"
          python3 Scripts/validation_evidence.py baseline "$BIT101_BASE_COMMIT"
      - name: Run behavior and production composition contracts on Mac Catalyst
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: Scripts/run-extended-tests.sh verify catalyst catalyst-release-runtime

      - name: Publish validation evidence
        if: ${{ !cancelled() && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: python3 Scripts/validation_evidence.py summary --recorded-environment

      - name: Export validated result
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: python3 Scripts/ci_evidence.py export-result catalyst
      - name: Publish validated result
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-result-catalyst
          path: .build/extended-automation/ci-validation-result.json
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          include-hidden-files: true

      - name: Prepare native compilation cache
        id: native-cache
        continue-on-error: true
        if: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: python3 Scripts/ci_evidence.py cache-export "catalyst-tests"
      - name: Preserve native compilation cache
        continue-on-error: true
        if: ${{ steps.native-cache.outcome == 'success' && (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compilation-cache-catalyst-tests
          compression-level: 0
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build/compiler-cache/CompilationCache.noindex
            .build/compiler-cache/compilation-cache.json
            .build/compiler-cache/swift-syntax-indexer
            .build/compiler-cache/swift-syntax-indexer-inputs.json
      - name: Select validation diagnostics
        id: diagnostics
        if: ${{ always() && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        env:
          BIT101_CI_CANCELLED: ${{ job.status == 'cancelled' }}
          BIT101_DIAGNOSTIC_PATHS: |
            .build/extended-automation/catalyst.log
            .build/extended-automation/catalyst-release-runtime.log
            .build/extended-automation/test-metrics.txt
            .build/extended-automation/test-failures.txt
            .build/extended-automation/test-results.xcresult
            .build/extended-automation/diagnostics/test-results.xcresult
        run: python3 Scripts/ci_diagnostics.py
      - name: Preserve validation diagnostics
        if: ${{ always() && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: ${{ steps.diagnostics.outputs.paths }}
  ios-app-tests:
    needs: [validation-plan]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check)
    name: iOS Simulator app and formal runtime
    runs-on: xcode-27
    timeout-minutes: 105
    env:
      BIT101_CI_PLAN: ${{ needs.validation-plan.outputs.plan }}
      BIT101_CI_GROUP: app
      BIT101_SIMULATOR_AUTHORIZED: '1'
      BIT101_CI_SHARD: '0/1'
      BIT101_SIMULATOR_WORKERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Verify maintainer review commit
        id: review
        if: github.event_name == 'workflow_dispatch' && inputs.review_pr > 0
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          base_sha="$(python3 Scripts/ci_evidence.py review-pr "$BIT101_REVIEW_PR")"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
      - name: Show toolchain
        run: Scripts/build-install-device.sh toolchain
      - name: Reuse compatible successful validation
        if: ${{ !fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: python3 Scripts/ci_evidence.py reuse "$BIT101_CI_GROUP"
      - name: Restore native compilation cache
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci_evidence.py cache-restore "simulator-app"
      - name: Load target branch coverage baseline
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_BASE_COMMIT: ${{ github.event.pull_request.base.sha || steps.review.outputs.base_sha }}
        run: |
          python3 Scripts/ci_evidence.py baseline "$BIT101_BASE_COMMIT"
          python3 Scripts/validation_evidence.py baseline "$BIT101_BASE_COMMIT"
      - name: Prepare full iOS Simulator
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: Scripts/run-extended-tests.sh simulator prepare
      - name: Run complete App behavior inventory
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: Scripts/run-extended-tests.sh simulator app
      - name: Select validation diagnostics
        id: app-diagnostics
        if: ${{ always() && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        env:
          BIT101_CI_CANCELLED: ${{ job.status == 'cancelled' }}
          BIT101_DIAGNOSTIC_PATHS: |
            .build/extended-automation/simulator.log
            .build/extended-automation/all.log
            .build/extended-automation/release-runtime.log
            build/DeviceInstall/build.log
            .build/extended-automation/restore.log
            .build/extended-automation/test-metrics.txt
            .build/extended-automation/test-results.xcresult
            .build/extended-automation/diagnostics/test-results.xcresult
            .build/screenshot.png
        run: python3 Scripts/ci_diagnostics.py
      - name: Preserve App validation diagnostics
        if: ${{ always() && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: validation-ios-test-shards-app-0
          compression-level: 0
          include-hidden-files: true
          path: ${{ steps.app-diagnostics.outputs.paths }}
      - name: Run complete formal runtime inventory
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: Scripts/run-extended-tests.sh simulator release-runtime
      - name: Prepare native compilation cache
        id: native-cache
        continue-on-error: true
        if: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        run: python3 Scripts/ci_evidence.py cache-export "simulator-app"
      - name: Preserve native compilation cache
        continue-on-error: true
        if: ${{ steps.native-cache.outcome == 'success' && (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compilation-cache-simulator-app
          compression-level: 0
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build/compiler-cache/CompilationCache.noindex
            .build/compiler-cache/compilation-cache.json
            .build/compiler-cache/swift-syntax-indexer
            .build/compiler-cache/swift-syntax-indexer-inputs.json
      - name: Select validation diagnostics
        id: diagnostics
        if: ${{ always() && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        env:
          BIT101_CI_CANCELLED: ${{ job.status == 'cancelled' }}
          BIT101_DIAGNOSTIC_PATHS: |
            .build/extended-automation/simulator.log
            .build/extended-automation/all.log
            .build/extended-automation/release-runtime.log
            build/DeviceInstall/build.log
            .build/extended-automation/restore.log
            .build/extended-automation/test-metrics.txt
            .build/extended-automation/test-results.xcresult
            .build/extended-automation/diagnostics/test-results.xcresult
            .build/screenshot.png
        run: python3 Scripts/ci_diagnostics.py
      - name: Preserve validation diagnostics
        if: ${{ always() && fromJSON(env.BIT101_CI_PLAN).jobs[env.BIT101_CI_GROUP].execute }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: ${{ steps.diagnostics.outputs.paths }}
  ios-tests:
    name: iOS Simulator behavior tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check)
    runs-on: xcode-27
    needs: [validation-plan, static-audit, ios-app-tests]
    timeout-minutes: 15
    env:
      BIT101_CI_PLAN: ${{ needs.validation-plan.outputs.plan }}
      BIT101_SIMULATOR_AUTHORIZED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Verify maintainer review commit
        id: review
        if: github.event_name == 'workflow_dispatch' && inputs.review_pr > 0
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          base_sha="$(python3 Scripts/ci_evidence.py review-pr "$BIT101_REVIEW_PR")"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
      - name: Show toolchain
        run: Scripts/build-install-device.sh toolchain
      - name: Load target branch coverage baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_BASE_COMMIT: ${{ github.event.pull_request.base.sha || steps.review.outputs.base_sha }}
        run: |
          python3 Scripts/ci_evidence.py baseline "$BIT101_BASE_COMMIT"
          python3 Scripts/validation_evidence.py baseline "$BIT101_BASE_COMMIT"
      - name: Verify complete Simulator inventory and merged coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: Scripts/run-extended-tests.sh simulator merge
      - name: Export validated result
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs.app.execute }}
        run: python3 Scripts/ci_evidence.py export-result ios
      - name: Publish validated result
        if: ${{ fromJSON(env.BIT101_CI_PLAN).jobs.app.execute }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-result-ios
          path: .build/extended-automation/ci-validation-result.json
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          include-hidden-files: true

      - name: Select validation diagnostics
        id: diagnostics
        if: ${{ always() }}
        env:
          BIT101_CI_CANCELLED: ${{ job.status == 'cancelled' }}
          BIT101_DIAGNOSTIC_PATHS: |
            .build/extended-automation/simulator.log
            .build/extended-automation/all.log
            .build/extended-automation/release-runtime.log
            build/DeviceInstall/build.log
            .build/extended-automation/restore.log
            .build/extended-automation/test-metrics.txt
            .build/extended-automation/test-results.xcresult
            .build/extended-automation/diagnostics/test-results.xcresult
            .build/screenshot.png
        run: python3 Scripts/ci_diagnostics.py
      - name: Preserve validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          overwrite: true
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: ${{ steps.diagnostics.outputs.paths }}
  release-acceptance:
    name: Release acceptance with bound device evidence
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.release_check
    needs: [static-audit, release-build, catalyst-tests, ios-tests]
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Download release validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_RELEASE_TAG: ${{ inputs.validation_tag || github.ref_name }}
        run: |
          python3 Scripts/ci_evidence.py release "$BIT101_RELEASE_TAG"
      - name: Check release validation evidence
        run: python3 Scripts/ci_evidence.py check-release

  merge-acceptance:
    name: Core CI acceptance
    if: always() && !cancelled()
    needs: [validation-plan, static-audit, release-build, catalyst-tests, ios-tests]
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Check current CI results
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_REQUIRED_RESULTS: ${{ toJSON(needs) }}
          BIT101_NATIVE_CHECK: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check) }}
        run: |
          python3 Scripts/ci_evidence.py current --results "$BIT101_REQUIRED_RESULTS"

  compiler-cache-cleanup:
    name: Keep one native compilation cache per group
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.full_check || inputs.release_check) }}
    needs: [release-build, catalyst-tests, ios-app-tests, ios-tests]
    runs-on: xcode-27
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Remove replaced compilation caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci_evidence.py cache-prune
