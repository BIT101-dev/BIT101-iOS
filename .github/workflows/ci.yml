name: iOS CI
run-name: ${{ inputs.review_pr && format('iOS CI review PR {0}', inputs.review_pr) || github.ref_name }}

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      review_pr:
        description: Reviewed fork PR number; select the internal branch containing its exact GitHub merge commit
        required: false
        default: 0
        type: number
      release_check:
        description: Run release acceptance against the public version and bound device evidence
        required: false
        default: false
        type: boolean
      validation_tag:
        description: Version tag containing the bound release-receipt.json asset
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-ci-${{ github.ref }}-${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.release_check }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.release_check) }}

jobs:
  static-audit:
    name: Static audit (Apple toolchain)
    runs-on: xcode-27
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Verify maintainer review commit
        id: review
        if: github.event_name == 'workflow_dispatch' && inputs.review_pr > 0
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          base_sha="$(python3 Scripts/ci_evidence.py review-pr "$BIT101_REVIEW_PR")"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
      - name: Show toolchain
        run: Scripts/build-install-device.sh toolchain
      - name: Install Worker test dependencies
        working-directory: Cloudflare/EmergencyUpdateWorker
        run: npm ci
      - name: Install Python analysis tool
        run: brew install --quiet ruff
      - name: Load target branch coverage baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_BASE_COMMIT: ${{ github.event.pull_request.base.sha || steps.review.outputs.base_sha }}
        run: |
          python3 Scripts/ci_evidence.py baseline "$BIT101_BASE_COMMIT"
          python3 Scripts/validation_evidence.py baseline "$BIT101_BASE_COMMIT"
      - name: Run static audit
        env:
          BIT101_VERSION_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || steps.review.outputs.base_sha || '' }}
          BIT101_RELEASE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.release_check }}
        run: Scripts/run-static-audit.sh
      - name: Test local Swift modules
        run: Scripts/run-extended-tests.sh modules

      - name: Publish validation evidence
        if: ${{ !cancelled() }}
        run: python3 Scripts/validation_evidence.py summary --recorded-environment

      - name: Preserve validation diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: |
            .build/static-audit/*.log
            .build/static-audit/swift-syntax-indexer
            .build/static-audit/swift-syntax-indexer-inputs.json
            .build/static-audit/compilation-conditions.json
            .build/code-quality-report.txt
            .build/ui-consistency-report.txt
            .build/explanatory-text-report.txt
            .build/extended-automation/modules.log
            .build/extended-automation/module-events.jsonl
            .build/extended-automation/test-metrics.txt

  release-build:
    name: Release app and extension builds
    runs-on: xcode-27
    timeout-minutes: 285
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Show toolchain
        run: Scripts/build-install-device.sh toolchain
      - name: Archive app and extensions with release compiler settings
        run: Scripts/build-install-device.sh archive
      - name: Build network smoke host and tests
        run: Scripts/run-extended-tests.sh build network-smoke
      - name: Build iCloud smoke host and tests
        run: Scripts/run-extended-tests.sh build icloud-smoke

      - name: Publish validation evidence
        if: ${{ !cancelled() }}
        run: python3 Scripts/validation_evidence.py summary --recorded-environment

      - name: Preserve validation diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: |
            .build/extended-automation/build-network-smoke.log
            .build/extended-automation/build-icloud-smoke.log
            .build/extended-automation/diagnostics/test-results.xcresult
            build/DeviceInstall/build.log

  catalyst-tests:
    needs: release-build
    name: Mac Catalyst behavior tests
    runs-on: xcode-27
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Verify maintainer review commit
        id: review
        if: github.event_name == 'workflow_dispatch' && inputs.review_pr > 0
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          base_sha="$(python3 Scripts/ci_evidence.py review-pr "$BIT101_REVIEW_PR")"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
      - name: Show toolchain
        run: Scripts/build-install-device.sh toolchain
      - name: Load target branch coverage baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_BASE_COMMIT: ${{ github.event.pull_request.base.sha || steps.review.outputs.base_sha }}
        run: |
          python3 Scripts/ci_evidence.py baseline "$BIT101_BASE_COMMIT"
          python3 Scripts/validation_evidence.py baseline "$BIT101_BASE_COMMIT"
      - name: Run behavior and production composition contracts on Mac Catalyst
        run: Scripts/run-extended-tests.sh verify catalyst catalyst-release-runtime

      - name: Publish validation evidence
        if: ${{ !cancelled() }}
        run: python3 Scripts/validation_evidence.py summary --recorded-environment

      - name: Preserve validation diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: |
            .build/extended-automation/catalyst.log
            .build/extended-automation/catalyst-release-runtime.log
            .build/extended-automation/test-metrics.txt
            .build/extended-automation/test-failures.txt
            .build/extended-automation/test-results.xcresult

  ios-test-shards:
    name: iOS Simulator ${{ matrix.mode }} (${{ matrix.shard }})
    runs-on: xcode-27
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {mode: app, shard: 0, count: 1, workers: 1}
          - {mode: ui, shard: 0, count: 2, workers: 1}
          - {mode: ui, shard: 1, count: 2, workers: 1}
    env:
      BIT101_SIMULATOR_AUTHORIZED: '1'
      BIT101_CI_SHARD: ${{ matrix.shard }}/${{ matrix.count }}
      BIT101_SIMULATOR_WORKERS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Verify maintainer review commit
        id: review
        if: github.event_name == 'workflow_dispatch' && inputs.review_pr > 0
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          base_sha="$(python3 Scripts/ci_evidence.py review-pr "$BIT101_REVIEW_PR")"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
      - name: Show toolchain
        run: Scripts/build-install-device.sh toolchain
      - name: Load target branch coverage baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_BASE_COMMIT: ${{ github.event.pull_request.base.sha || steps.review.outputs.base_sha }}
        run: |
          python3 Scripts/ci_evidence.py baseline "$BIT101_BASE_COMMIT"
          python3 Scripts/validation_evidence.py baseline "$BIT101_BASE_COMMIT"
      - name: Prepare full iOS Simulator
        run: Scripts/run-extended-tests.sh simulator prepare
      - name: Run assigned complete Simulator inventory
        run: Scripts/run-extended-tests.sh simulator "${{ matrix.mode }}"
      - name: Preserve validation diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-${{ github.job }}-${{ matrix.mode }}-${{ matrix.shard }}
          compression-level: 0
          include-hidden-files: true
          path: |
            .build/extended-automation/simulator.log
            .build/extended-automation/all.log
            .build/extended-automation/release-runtime.log
            .build/extended-automation/ui.log
            .build/extended-automation/build-release.log
            .build/extended-automation/restore.log
            .build/extended-automation/test-metrics.txt
            .build/extended-automation/test-results.xcresult
            .build/screenshot.png

  ios-release-runtime:
    needs: release-build
    name: iOS Simulator release-runtime (0)
    runs-on: xcode-27
    timeout-minutes: 105
    env:
      BIT101_SIMULATOR_AUTHORIZED: '1'
      BIT101_CI_SHARD: '0/1'
      BIT101_SIMULATOR_WORKERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Verify maintainer review commit
        id: review
        if: github.event_name == 'workflow_dispatch' && inputs.review_pr > 0
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          base_sha="$(python3 Scripts/ci_evidence.py review-pr "$BIT101_REVIEW_PR")"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
      - name: Show toolchain
        run: Scripts/build-install-device.sh toolchain
      - name: Load target branch coverage baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_BASE_COMMIT: ${{ github.event.pull_request.base.sha || steps.review.outputs.base_sha }}
        run: |
          python3 Scripts/ci_evidence.py baseline "$BIT101_BASE_COMMIT"
          python3 Scripts/validation_evidence.py baseline "$BIT101_BASE_COMMIT"
      - name: Prepare full iOS Simulator
        run: Scripts/run-extended-tests.sh simulator prepare
      - name: Run complete formal runtime inventory
        run: Scripts/run-extended-tests.sh simulator release-runtime
      - name: Preserve validation diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: |
            .build/extended-automation/simulator.log
            .build/extended-automation/all.log
            .build/extended-automation/release-runtime.log
            .build/extended-automation/ui.log
            .build/extended-automation/build-release.log
            .build/extended-automation/restore.log
            .build/extended-automation/test-metrics.txt
            .build/extended-automation/test-results.xcresult
            .build/screenshot.png

  ios-tests:
    name: iOS Simulator behavior and UI tests
    runs-on: xcode-27
    needs: [static-audit, ios-test-shards, ios-release-runtime]
    timeout-minutes: 15
    env:
      BIT101_SIMULATOR_AUTHORIZED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Verify maintainer review commit
        id: review
        if: github.event_name == 'workflow_dispatch' && inputs.review_pr > 0
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          base_sha="$(python3 Scripts/ci_evidence.py review-pr "$BIT101_REVIEW_PR")"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
      - name: Show toolchain
        run: Scripts/build-install-device.sh toolchain
      - name: Load target branch coverage baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_BASE_COMMIT: ${{ github.event.pull_request.base.sha || steps.review.outputs.base_sha }}
        run: |
          python3 Scripts/ci_evidence.py baseline "$BIT101_BASE_COMMIT"
          python3 Scripts/validation_evidence.py baseline "$BIT101_BASE_COMMIT"
      - name: Verify complete Simulator inventory and merged coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: Scripts/run-extended-tests.sh simulator merge
      - name: Preserve validation diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: |
            .build/extended-automation/simulator.log
            .build/extended-automation/all.log
            .build/extended-automation/release-runtime.log
            .build/extended-automation/ui.log
            .build/extended-automation/build-release.log
            .build/extended-automation/restore.log
            .build/extended-automation/test-metrics.txt
            .build/extended-automation/test-results.xcresult
            .build/screenshot.png

  physical-device:
    name: Physical-device behavior and UI acceptance
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.release_check
    runs-on: [self-hosted, macOS, bit101-xcode-27, bit101-device]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Verify maintainer review commit
        id: review
        if: github.event_name == 'workflow_dispatch' && inputs.review_pr > 0
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          base_sha="$(python3 Scripts/ci_evidence.py review-pr "$BIT101_REVIEW_PR")"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
      - name: Load target branch coverage baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_BASE_COMMIT: ${{ github.event.pull_request.base.sha || steps.review.outputs.base_sha }}
        run: |
          python3 Scripts/ci_evidence.py baseline "$BIT101_BASE_COMMIT"
          python3 Scripts/validation_evidence.py baseline "$BIT101_BASE_COMMIT"
      - name: Run physical-device acceptance
        run: Scripts/run-extended-tests.sh verify modules all release-runtime ui
      - name: Bind core validation evidence
        run: python3 Scripts/validation_evidence.py bind-merge
      - name: Export core CI evidence
        if: always()
        run: python3 Scripts/ci_evidence.py export-core
      - name: Publish core validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-evidence
          path: .build/extended-automation/core-validation-evidence.json
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          include-hidden-files: true
      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: |
            .build/extended-automation/*.log
            .build/extended-automation/*.txt
            .build/extended-automation/test-results.xcresult

  release-acceptance:
    name: Release acceptance with bound device evidence
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.release_check
    needs: [static-audit, release-build, catalyst-tests, ios-tests, physical-device]
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Download release validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_RELEASE_TAG: ${{ inputs.validation_tag || github.ref_name }}
        run: |
          python3 Scripts/ci_evidence.py release "$BIT101_RELEASE_TAG"
      - name: Check release validation evidence
        run: python3 Scripts/ci_evidence.py check-release

  merge-acceptance:
    name: Core CI acceptance
    if: always() && !cancelled()
    needs: [static-audit, release-build, catalyst-tests, ios-tests]
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          clean: false
      - name: Check current CI results
        env:
          GH_TOKEN: ${{ github.token }}
          BIT101_REQUIRED_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          python3 Scripts/ci_evidence.py current --results "$BIT101_REQUIRED_RESULTS"
