name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_check:
        description: Confirm that the local version is newer than the App Store version
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: Static audit (Apple toolchain)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show toolchain
        shell: bash
        run: |
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          grep -Eq '^Xcode (2[7-9]|[3-9][0-9]|[1-9][0-9]{2,})\.' <<<"$version"
      - name: Validate project
        run: plutil -lint BIT101-iOS.xcodeproj/project.pbxproj
      - name: Validate versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            python3 Scripts/validate_versions.py \
              --compare-git-ref "origin/${GITHUB_BASE_REF}"
          else
            python3 Scripts/validate_versions.py
          fi
      - name: Validate release against App Store
        if: github.event_name == 'workflow_dispatch' && inputs.release_check
        run: python3 Scripts/validate_versions.py --check-app-store
      - name: Run static audit
        run: Scripts/run-static-audit.sh

  release-build:
    name: Release build and extension schemes
    needs: static-audit
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show toolchain
        shell: bash
        run: |
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          grep -Eq '^Xcode (2[7-9]|[3-9][0-9]|[1-9][0-9]{2,})\.' <<<"$version"
      - name: Validate project
        run: plutil -lint BIT101-iOS.xcodeproj/project.pbxproj
      - name: Validate versions
        run: python3 Scripts/validate_versions.py
      - name: Build iOS app and tests without a simulator
        run: >-
          xcodebuild build-for-testing
          -project BIT101-iOS.xcodeproj
          -scheme BIT101-iOS
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/CI
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Build Watch app and Watch Widget without a simulator
        run: >-
          xcodebuild build
          -project BIT101-iOS.xcodeproj
          -scheme BIT101Watch
          -configuration Release
          -destination 'generic/platform=watchOS'
          -derivedDataPath build/CI
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Build iOS Widget without a simulator
        run: >-
          xcodebuild build
          -project BIT101-iOS.xcodeproj
          -scheme BIT101ScheduleWidgets
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/CI
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Build Watch Widget without a simulator
        run: >-
          xcodebuild build
          -project BIT101-iOS.xcodeproj
          -scheme BIT101WatchWidgets
          -configuration Release
          -destination 'generic/platform=watchOS'
          -derivedDataPath build/CI
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Run behavior tests on Mac Catalyst
        run: Scripts/run-extended-tests.sh catalyst
