name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_check:
        description: Confirm that the local version is newer than the App Store version
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: Static audit (Apple toolchain)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show toolchain
        shell: bash
        run: |
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          grep -Eq '^Xcode (2[7-9]|[3-9][0-9]|[1-9][0-9]{2,})\.' <<<"$version"
      - name: Run static audit
        env:
          BIT101_VERSION_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
          BIT101_RELEASE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.release_check }}
        run: Scripts/run-static-audit.sh
      - name: Test local Swift modules
        run: Scripts/run-extended-tests.sh modules

      - name: Publish validation evidence
        if: always()
        run: python3 Scripts/validation_evidence.py summary

  release-build:
    name: Release app and extension builds
    needs: static-audit
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show toolchain
        shell: bash
        run: |
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          grep -Eq '^Xcode (2[7-9]|[3-9][0-9]|[1-9][0-9]{2,})\.' <<<"$version"
      - name: Build iOS app, Watch, widgets and tests
        run: Scripts/run-extended-tests.sh build release
      - name: Build UI automation host and tests
        run: Scripts/run-extended-tests.sh build ui
      - name: Build network smoke host and tests
        run: Scripts/run-extended-tests.sh build network-smoke
      - name: Build iCloud smoke host and tests
        run: Scripts/run-extended-tests.sh build icloud-smoke

      - name: Publish validation evidence
        if: always()
        run: python3 Scripts/validation_evidence.py summary

  catalyst-tests:
    name: Mac Catalyst behavior tests
    needs: static-audit
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show toolchain
        shell: bash
        run: |
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          grep -Eq '^Xcode (2[7-9]|[3-9][0-9]|[1-9][0-9]{2,})\.' <<<"$version"
      - name: Run behavior tests on Mac Catalyst
        run: Scripts/run-extended-tests.sh catalyst

      - name: Publish validation evidence
        if: always()
        run: python3 Scripts/validation_evidence.py summary
