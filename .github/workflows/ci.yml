name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_check:
        description: Confirm that the local version is newer than the App Store version
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-for-testing:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show toolchain
        run: xcodebuild -version
      - name: Validate project
        run: plutil -lint BIT101-iOS.xcodeproj/project.pbxproj
      - name: Validate versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            python3 Scripts/validate_versions.py \
              --compare-git-ref "origin/${GITHUB_BASE_REF}"
          else
            python3 Scripts/validate_versions.py
          fi
      - name: Validate release against App Store
        if: github.event_name == 'workflow_dispatch' && inputs.release_check
        run: python3 Scripts/validate_versions.py --check-app-store
      - name: Run static audit
        run: Scripts/run-static-audit.sh
      - name: Build app and tests without a simulator
        run: >-
          xcodebuild build-for-testing
          -project BIT101-iOS.xcodeproj
          -scheme BIT101-iOS
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath build/CI
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
