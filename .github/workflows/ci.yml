name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_check:
        description: Run release acceptance against the public version and bound device evidence
        required: false
        default: false
        type: boolean
      validation_evidence:
        description: HTTPS URL of the bound validation-evidence.json for the release commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: Static audit (Apple toolchain)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show toolchain
        shell: bash
        run: |
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          grep -Eq '^Xcode (2[7-9]|[3-9][0-9]|[1-9][0-9]{2,})\.' <<<"$version"
      - name: Install Worker test dependencies
        working-directory: Cloudflare/EmergencyUpdateWorker
        run: npm ci
      - name: Load target branch coverage baseline
        if: github.event_name == 'pull_request'
        env:
          BIT101_COVERAGE_BASELINE_URL: ${{ vars.BIT101_COVERAGE_BASELINE_URL }}
          BIT101_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$BIT101_COVERAGE_BASELINE_URL" == https://* ]] || { echo 'Coverage baseline requires an HTTPS URL.' >&2; exit 64; }
          mkdir -p .build/extended-automation
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --output .build/extended-automation/validation-evidence.json "$BIT101_COVERAGE_BASELINE_URL"
          python3 Scripts/validation_evidence.py baseline "$BIT101_BASE_COMMIT"
      - name: Run static audit
        env:
          BIT101_VERSION_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
          BIT101_RELEASE_CHECK: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.release_check }}
        run: Scripts/run-static-audit.sh
      - name: Test local Swift modules
        run: Scripts/run-extended-tests.sh modules

      - name: Publish validation evidence
        if: always()
        run: python3 Scripts/validation_evidence.py summary

      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: |
            .build/static-audit/*.log
            .build/code-quality-report.txt
            .build/ui-consistency-report.txt
            .build/explanatory-text-report.txt
            .build/extended-automation/*.log
            .build/extended-automation/*.txt
            .build/extended-automation/validation-evidence.json
            .build/extended-automation/test-results.xcresult

  release-build:
    name: Release app and extension builds
    needs: static-audit
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show toolchain
        shell: bash
        run: |
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          grep -Eq '^Xcode (2[7-9]|[3-9][0-9]|[1-9][0-9]{2,})\.' <<<"$version"
      - name: Build iOS app, Watch, widgets and tests
        run: Scripts/run-extended-tests.sh build release
      - name: Archive app and extensions with release compiler settings
        run: Scripts/build-install-device.sh archive
      - name: Build UI automation host and tests
        run: Scripts/run-extended-tests.sh build ui
      - name: Build network smoke host and tests
        run: Scripts/run-extended-tests.sh build network-smoke
      - name: Build iCloud smoke host and tests
        run: Scripts/run-extended-tests.sh build icloud-smoke

      - name: Publish validation evidence
        if: always()
        run: python3 Scripts/validation_evidence.py summary

      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: |
            .build/static-audit/*.log
            .build/code-quality-report.txt
            .build/ui-consistency-report.txt
            .build/explanatory-text-report.txt
            .build/extended-automation/*.log
            .build/extended-automation/*.txt
            .build/extended-automation/validation-evidence.json
            .build/extended-automation/test-results.xcresult
            build/DeviceInstall/build.log

  catalyst-tests:
    name: Mac Catalyst behavior tests
    needs: static-audit
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show toolchain
        shell: bash
        run: |
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          grep -Eq '^Xcode (2[7-9]|[3-9][0-9]|[1-9][0-9]{2,})\.' <<<"$version"
      - name: Run behavior tests on Mac Catalyst
        run: Scripts/run-extended-tests.sh catalyst
      - name: Run production composition contracts on Mac Catalyst
        run: Scripts/run-extended-tests.sh catalyst-release-runtime

      - name: Publish validation evidence
        if: always()
        run: python3 Scripts/validation_evidence.py summary

      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ github.job }}
          compression-level: 0
          include-hidden-files: true
          path: |
            .build/static-audit/*.log
            .build/code-quality-report.txt
            .build/ui-consistency-report.txt
            .build/explanatory-text-report.txt
            .build/extended-automation/*.log
            .build/extended-automation/*.txt
            .build/extended-automation/validation-evidence.json
            .build/extended-automation/test-results.xcresult

  release-acceptance:
    name: Release acceptance with bound device evidence
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.release_check
    needs: [static-audit, release-build, catalyst-tests]
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download release validation evidence
        env:
          BIT101_RELEASE_EVIDENCE_URL: ${{ inputs.validation_evidence || vars.BIT101_RELEASE_EVIDENCE_URL }}
        run: |
          [[ "$BIT101_RELEASE_EVIDENCE_URL" == https://* ]] || { echo 'Release evidence requires an HTTPS URL.' >&2; exit 64; }
          mkdir -p .build/extended-automation
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --output .build/extended-automation/validation-evidence.json "$BIT101_RELEASE_EVIDENCE_URL"
      - name: Check release validation evidence
        run: python3 Scripts/validation_evidence.py check --recorded-environment
      - name: Publish validation evidence
        if: always()
        run: python3 Scripts/validation_evidence.py summary --recorded-environment

  merge-acceptance:
    name: Core physical-device acceptance
    if: github.event_name == 'pull_request'
    needs: [static-audit, release-build, catalyst-tests]
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download merge validation evidence
        env:
          BIT101_MERGE_EVIDENCE_URL: ${{ vars.BIT101_MERGE_EVIDENCE_URL }}
        run: |
          [[ "$BIT101_MERGE_EVIDENCE_URL" == https://* ]] || { echo 'Merge evidence requires an HTTPS URL.' >&2; exit 64; }
          mkdir -p .build/extended-automation
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --output .build/extended-automation/validation-evidence.json "$BIT101_MERGE_EVIDENCE_URL"
      - name: Check core physical-device evidence
        run: python3 Scripts/validation_evidence.py check-merge --recorded-environment
