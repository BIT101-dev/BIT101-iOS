name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Validate project
        run: plutil -lint BIT101-iOS.xcodeproj/project.pbxproj
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | jq -r '
            [.devices[][] | select(.name | startswith("iPhone"))][0].udid
          ')"
          test -n "$DEVICE_ID" && test "$DEVICE_ID" != "null"
          xcodebuild test \
            -project BIT101-iOS.xcodeproj \
            -scheme BIT101-iOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/CI \
            CODE_SIGNING_ALLOWED=NO
